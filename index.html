<html lang="ja">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f1f6f5;
    --card: #ffffff;
    --accent: #2a9d8f;      /* 落ち着いたブルーグリーン */
    --accent-d: #218577;    /* 濃いめ（hover/active） */
    --accent2: #2a9d8f;
    --text: #22403c;
    --muted: #6b8480;
    --border: #e4ecea;
    --input: #f6f9f8;
    --danger: #d9564f;
    --ok: #2a9d8f;
    --warn: #c98a1e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #eef4f3; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f4f8f7 0%, #eef4f3 100%) no-repeat;
    background-size: cover;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; padding: 2px; }
  .logo {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-text { min-width: 0; }
  h1 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: #1e2b4d; line-height: 1.15;
  }
  .subtitle { color: var(--muted); font-size: 11.5px; margin-top: 3px; letter-spacing: .01em; line-height: 1.45; }

  .add-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px 18px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(30,60,58,0.04);
  }
  .field { margin-bottom: 14px; }
  .field.two { display: flex; gap: 11px; }
  .field.two > div { flex: 1 1 0; min-width: 0; }
  /* 狭い画面では日付と期間を縦並びにして重なりを防ぐ */
  @media (max-width: 430px) {
    .field.two { flex-direction: column; gap: 14px; }
  }
  label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: .02em; }
  input[type="text"], input[type="date"], input[type="number"], select {
    width: 100%;
    min-width: 0;
    padding: 12px 13px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(42,157,143,0.15); }
  /* iOS Safari で日付欄が枠からはみ出すのを防ぐ（ネイティブ表示を無効化して width:100% を効かせる） */
  input[type="date"] { -webkit-appearance: none; appearance: none; max-width: 100%; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .55; margin-left: auto; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer; }

  .picker { display: flex; flex-wrap: wrap; gap: 7px; }
  .color-opt {
    cursor: pointer; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; transition: transform .08s;
    width: 28px; height: 28px; border-radius: 50%;
  }
  .color-opt.sel { border-color: #163b4d; transform: scale(1.12); }

  /* 絵文字ピッカー */
  .icon-current { display: flex; align-items: center; gap: 10px; }
  .icon-current-emoji {
    width: 46px; height: 46px; border-radius: 11px; background: var(--input);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto;
  }
  .btn-pick {
    padding: 11px 15px; border: 1px solid var(--border); background: var(--input);
    border-radius: 9px; color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .emoji-panel {
    margin-top: 10px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--input); padding: 10px;
  }
  .emoji-panel[hidden] { display: none; }
  #emojiSearch { width: 100%; margin-bottom: 8px; }
  .emoji-cats {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px;
    margin-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .emoji-cat {
    flex: 0 0 auto; width: 34px; height: 34px; border: none; background: transparent;
    border-radius: 8px; font-size: 18px; cursor: pointer; opacity: .5;
  }
  .emoji-cat.active { background: var(--card); opacity: 1; box-shadow: inset 0 0 0 2px var(--accent); }
  .emoji-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 2px; max-height: 200px; overflow-y: auto;
  }
  .emoji-grid button {
    aspect-ratio: 1 / 1; border: none; background: transparent; border-radius: 8px;
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0;
  }
  .emoji-grid button:hover { background: var(--card); }
  .emoji-grid .none { grid-column: 1 / -1; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
  .emoji-direct { margin-top: 8px; }
  #emojiInput { width: 100%; }

  .btn {
    width: 100%; padding: 13px;
    background: var(--accent);
    border: none; border-radius: 11px; color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: .02em; cursor: pointer; margin-top: 8px;
    transition: background .15s, transform .08s;
  }
  .btn:hover { background: var(--accent-d); }
  .btn:active { transform: translateY(1px); }
  .btn-ghost {
    width: 100%; padding: 11px; margin-top: 9px;
    background: transparent; border: 1px solid var(--border); border-radius: 12px;
    color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:active { transform: scale(0.99); }
  .editing .add-card { box-shadow: 0 0 0 2px var(--accent); }

  .toolbar {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; margin-bottom: 14px; font-size: 12px; color: var(--muted);
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button {
    background: transparent; border: none; color: var(--muted);
    font-size: 12px; padding: 7px 13px; cursor: pointer; font-family: inherit; transition: background .12s, color .12s, transform .1s;
  }
  .seg button:active { transform: scale(0.96); }
  .seg button.active { background: var(--accent); color: #fff; font-weight: 700; }
  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    font-size: 12px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-family: inherit;
    transition: background .12s, color .12s, border-color .12s, transform .1s;
  }
  .chip:active { transform: scale(0.97); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 14px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 2px rgba(30,60,58,0.04); touch-action: pan-y;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  @media (hover: hover) {
    .item:hover { border-color: #cdddd8; box-shadow: 0 2px 8px rgba(30,60,58,0.07); }
  }
  .item.expired { border-color: var(--danger); border-left-color: var(--danger); background: #fdf5f4; }
  .item.done { background: #f3f8f6; }
  .item.done .iname { text-decoration: line-through; color: var(--muted); }
  .item.done .avatar { filter: grayscale(0.4); opacity: .8; }
  .item.dragging { opacity: .9; box-shadow: 0 16px 30px rgba(20,90,130,0.20); }
  .check-toggle {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; padding: 0;
    border: 2px solid var(--border); background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff; line-height: 1;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
  }
  .check-toggle:hover { border-color: var(--ok); }
  .check-toggle:active { transform: scale(0.9); }
  .check-toggle.checked { background: var(--ok); border-color: var(--ok); }
  .handle {
    cursor: grab; color: var(--muted); font-size: 18px; line-height: 1;
    padding: 4px 2px; touch-action: none; user-select: none; flex-shrink: 0;
  }
  .handle:active { cursor: grabbing; }
  .avatar {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .item .info { flex: 1 1 auto; min-width: 0; }
  .item .iname { display: block; font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: .01em; overflow-wrap: anywhere; }
  .item .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .item .sub .stat { color: var(--accent); font-weight: 600; }
  .refill {
    margin-top: 9px; padding: 8px 13px; font-size: 12px; font-weight: 700;
    border: none; border-radius: 9px; cursor: pointer; font-family: inherit;
    background: var(--accent); color: #fff;
    transition: background .15s, transform .1s;
  }
  .refill:hover { background: var(--accent-d); }
  .refill:active { transform: scale(0.98); }
  .item .count {
    display: flex; flex-direction: column; align-items: flex-end;
    flex-shrink: 0; min-width: 56px; padding-left: 6px;
  }
  .count .status { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; line-height: 1; margin-bottom: 3px; }
  .count .status[hidden] { display: none; }
  .item .num { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .item .unit { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 3px; letter-spacing: .03em; white-space: nowrap; }
  .actions { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .edit, .del {
    background: none; border: none; color: #aebfba;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 4px;
    transition: color .12s, transform .1s;
  }
  .edit:hover { color: var(--accent); }
  .del:hover { color: var(--danger); }
  .edit:active, .del:active { transform: scale(0.88); }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
</style>
</head>

          <div class="emoji-grid" id="emojiGrid"></div>
          <div class="emoji-direct">

      </div>
      <div class="field">
        <label>カラー</label>
        <div class="picker" id="colorPicker"></div>
      </div>
      <button class="btn" id="addBtn">＋ 追加する</button>
      <button class="btn-ghost" id="cancelBtn" style="display:none;">編集をやめる</button>
    </div>

    <div class="filters" id="filters"></div>

    <div class="toolbar">
      <div class="seg">
        <button data-mode="expiry" id="segExpiry">期限順</button>
        <button data-mode="recent" id="segRecent">新しい順</button>
        <button data-mode="old" id="segOld">古い順</button>
        <button data-mode="manual" id="segManual">手動</button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>

  };
  let emojiCat = Object.keys(EMOJI)[0];

  // カテゴリ定義。hasPeriod=false のカテゴリは「期限なし＝経過（◯日前）」で管理
  const CATS = [
    { id: "cosme",  label: "コスメ",   emoji: "💄", defaultIcon: "💄", color: "#e08aa4", hasPeriod: true,  datePrefix: "開封",   dateLabel: "開封日 / 使用開始日", namePh: "例: 化粧水、日焼け止め、マスカラ" },

  function catOf(id) { return CATS.find(c => c.id === id) || CATS[0]; }

  let selIcon = ICONS[0];

  let sortMode = localStorage.getItem(MODE_KEY) || "expiry";
  let filterCat = localStorage.getItem(FILTER_KEY) || "all";
  let editingId = null;

  function todayMid() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function todayStr() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function elapsedDays(startISO) {
    const s = new Date(startISO + "T00:00:00");
    return Math.floor((todayMid() - s) / 86400000);
  }
  function fmt(iso) {
    const d = (iso instanceof Date) ? iso : new Date(iso + "T00:00:00");
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }

  // period stored as {type:'months',value} | {type:'days',value} | {type:'none'}
  function expiryOf(it) {
    const p = it.period;
    if (!p || p.type === "none") return null;
    const s = new Date(it.start + "T00:00:00");
    if (p.type === "months") return new Date(s.getFullYear(), s.getMonth() + p.value, s.getDate());
    return new Date(s.getTime() + p.value * 86400000);
  }
  function remainingDays(it) {
    const exp = expiryOf(it);
    if (!exp) return null;
    return Math.floor((exp - todayMid()) / 86400000);
  }
  function daysBetween(aISO, bISO) {
    return Math.floor((new Date(bISO + "T00:00:00") - new Date(aISO + "T00:00:00")) / 86400000);
  }
  // 同じ名称ごとに「登録数」と「完了した使い切り日数」を集計
  function nameStats(items) {
    const m = {};
    for (const it of items) {
      const key = (it.name || "").trim();
      if (!key) continue;
      if (!m[key]) m[key] = { total: 0, durations: [] };
      m[key].total++;
      if (it.done) m[key].durations.push(Math.max(daysBetween(it.start, it.done), 0));
    }
    return m;
  }
  function periodLabel(p) {
    if (!p || p.type === "none") return "期限なし";
    if (p.type === "months") return `${p.value}ヶ月`;
    return `${p.value}日間`;
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  // 背景色に対して読みやすい文字色（明るい色→濃色、暗い色→白）
  function textOn(hex) {
    const n = parseInt(hex.slice(1), 16);
    const L = 0.299 * ((n>>16)&255) + 0.587 * ((n>>8)&255) + 0.114 * (n&255);
    return L > 175 ? "#0f2e3d" : "#ffffff";
  }
  // 入力文字列の先頭1絵文字（ZWJ結合・肌色などの結合文字対応）
  function firstEmoji(str) {
    str = (str || "").trim();
    if (!str) return "";
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      for (const s of seg.segment(str)) return s.segment;
    }
    return Array.from(str)[0];
  }

  function loadItems() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function saveItems(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

  function buildPickers() {
    $("iconCurrent").textContent = selIcon;
    const cp = $("colorPicker"); cp.innerHTML = "";
    COLORS.forEach(c => {
      const b = document.createElement("div");
      b.className = "color-opt" + (c === selColor ? " sel" : "");
      b.style.background = c;
      b.onclick = () => { selColor = c; buildPickers(); };
      cp.appendChild(b);
    });
  }

  function sortForDisplay(items) {
    if (sortMode === "manual") return items;
    if (sortMode === "recent") {
      // 新しい順（開始日が新しいものが上）
      return items.slice().sort((a, b) => (a.start < b.start ? 1 : a.start > b.start ? -1 : 0));
    }
    if (sortMode === "old") {
      // 古い順（開始日が古いものが上）
      return items.slice().sort((a, b) => (a.start > b.start ? 1 : a.start < b.start ? -1 : 0));
    }
    // 期限が近い順: 期限切れ→まもなく→余裕→期限なし（完了も混ぜて表示）
    return items.slice().sort((a, b) => {
      const ra = remainingDays(a), rb = remainingDays(b);
      const va = (ra === null) ? Infinity : ra;
      const vb = (rb === null) ? Infinity : rb;
      return va - vb;
    });
  }

  function renderFilters() {
    const wrap = $("filters"); wrap.innerHTML = "";
    const items = loadItems();
    const chips = [{ id: "all", label: "すべて", emoji: "🗂" }].concat(CATS);
    chips.forEach(c => {
      const count = (c.id === "all") ? items.length : items.filter(it => (it.cat || "cosme") === c.id).length;
      const b = document.createElement("button");
      b.className = "chip" + (filterCat === c.id ? " active" : "");
      b.textContent = `${c.emoji} ${c.label}` + (count ? ` (${count})` : "");
      b.onclick = () => { filterCat = c.id; localStorage.setItem(FILTER_KEY, filterCat); render(); };
      wrap.appendChild(b);
    });
  }

  function render() {
    renderFilters();
    let items = loadItems();
    const total = items.length;
    if (filterCat !== "all") items = items.filter(it => (it.cat || "cosme") === filterCat);
    items = sortForDisplay(items);
    $("segExpiry").classList.toggle("active", sortMode === "expiry");
    $("segRecent").classList.toggle("active", sortMode === "recent");
    $("segOld").classList.toggle("active", sortMode === "old");
    $("segManual").classList.toggle("active", sortMode === "manual");

    const list = $("list");
    list.innerHTML = "";
    if (items.length === 0) {
      list.innerHTML = (total === 0)
        ? '<div class="empty">まだ登録がありません。<br>コスメ・日用品や、会った人・やったことを追加してください。</div>'
        : '<div class="empty">このカテゴリの登録はありません。</div>';
      return;
    }

    for (const it of items) {
      const cat = catOf(it.cat || "cosme");
      const color = it.color || COLORS[0];
      const icon = it.icon || ICONS[0];
      const elapsed = elapsedDays(it.start);

      // 数字（主役）・単位・ステータス（特別な状態のときだけ小さく表示）
      const TEAL = "#2a9d8f", RED = "#d9564f", AMBER = "#c98a1e";
      let numText, numColor, unitText, sub, isExpired = false, statusText = "";
      if (it.done) {
        // 完了：開始日〜完了日の経過日数
        const used = Math.max(daysBetween(it.start, it.done), 0);
        statusText = "完了";
        numText = used.toLocaleString(); numColor = TEAL; unitText = "日間";
        sub = `開封 ${fmt(it.start)} 〜 完了 ${fmt(it.done)}`;
      } else if (cat.hasPeriod) {
        const rem = remainingDays(it);
        const exp = expiryOf(it);
        if (rem === null) {
          numText = Math.max(elapsed, 0).toLocaleString(); numColor = TEAL; unitText = "日経過";
        } else if (rem < 0) {
          isExpired = true; statusText = "期限切れ";
          numText = Math.abs(rem).toLocaleString(); numColor = RED; unitText = "日超過";
        } else if (rem <= SOON) {
          statusText = "まもなく";
          numText = rem.toLocaleString(); numColor = AMBER; unitText = "日で期限";
        } else {
          numText = rem.toLocaleString(); numColor = TEAL; unitText = "日で期限";
        }
        sub = `開封 ${fmt(it.start)}`;
        if (exp) sub += `・期限 ${fmt(exp)}`;
      } else {
        numText = Math.max(elapsed, 0).toLocaleString(); numColor = TEAL; unitText = "日ぶり";
        sub = `${cat.datePrefix} ${fmt(it.start)}`;
      }

      // この箱の使い切り平均（過去サイクルの履歴が1回以上あるとき表示）
      if (it.history && it.history.length >= 1) {
        const ds = boxDurations(it);
        if (ds.length) {
          const avg = Math.round(ds.reduce((a, b) => a + b, 0) / ds.length);
          let line = `📊 平均 ${avg}日で使い切り（${ds.length}回）`;
          if (!it.done) {
            const predicted = new Date(new Date(it.start + "T00:00:00").getTime() + avg * 86400000);
            line += `・目安 ${fmt(predicted)}`;
          }
          sub += `<br><span class="stat">${line}</span>`;
        }
      }

      const el = document.createElement("div");
      el.className = "item" + (isExpired ? " expired" : "") + (it.done ? " done" : "");
      el.dataset.id = it.id;
      el.style.borderLeftColor = it.done ? "#2a9d8f" : (isExpired ? "#d9564f" : color);
      el.innerHTML = `
        <button class="check-toggle${it.done ? " checked" : ""}" title="${it.done ? "使用中に戻す" : "完了にする"}">${it.done ? "✓" : ""}</button>
        <div class="handle" title="ドラッグで並び替え">⋮⋮</div>
        <div class="avatar"></div>
        <div class="info">
          <span class="iname"></span>
          <div class="sub"></div>
          <button class="refill" hidden>🔄 新しく使い始める</button>
        </div>
        <div class="count">
          <div class="status" hidden></div>
          <div class="num"></div>
          <div class="unit"></div>
        </div>
        <div class="actions">
          <button class="edit" title="編集">✎</button>
          <button class="del" title="削除">✕</button>
        </div>`;

      const av = el.querySelector(".avatar");
      av.textContent = icon;
      av.style.background = hexA(color, 0.13);
      el.querySelector(".iname").textContent = it.name || "(名称なし)";
      const stEl = el.querySelector(".status");
      if (statusText) { stEl.textContent = statusText; stEl.style.color = numColor; stEl.hidden = false; }
      el.querySelector(".sub").innerHTML = sub;
      const numEl = el.querySelector(".num");
      numEl.textContent = numText;
      numEl.style.color = numColor;
      el.querySelector(".unit").textContent = unitText;
      el.querySelector(".check-toggle").onclick = () => toggleDone(it.id);
      el.querySelector(".edit").onclick = () => startEdit(it.id);
      el.querySelector(".del").onclick = () => removeItem(it.id);
      const refillBtn = el.querySelector(".refill");
      if (it.done) { refillBtn.hidden = false; refillBtn.onclick = () => refillBox(it.id); }

      const handle = el.querySelector(".handle");
      if (sortMode === "manual") {
        handle.addEventListener("pointerdown", (e) => startDrag(e, el, handle));
      } else {
        handle.style.display = "none";
      }
      list.appendChild(el);
    }
  }

  function removeItem(id) {
    saveItems(loadItems().filter(x => x.id !== id));
    render();
  }

  function toggleDone(id) {
    const items = loadItems();
    const it = items.find(x => x.id === id);
    if (!it) return;
    if (it.done) delete it.done;         // 使用中に戻す
    else it.done = todayStr();           // 今日を完了日（今回の使い切り）として記録
    saveItems(items);
    render();
  }

  // この箱の使い切り日数（履歴の各サイクル＋現在サイクルが完了していればそれも）
  function boxDurations(it) {
    const arr = (it.history || []).filter(c => c.done).map(c => Math.max(daysBetween(c.start, c.done), 0));
    if (it.done) arr.push(Math.max(daysBetween(it.start, it.done), 0));
    return arr;
  }

  // 使い切った箱に、同じ箱のまま新しい使用サイクルを開始（今日を開封日に）
  function refillBox(id) {
    const items = loadItems();
    const it = items.find(x => x.id === id);
    if (!it || !it.done) return;
    it.history = it.history || [];
    it.history.push({ start: it.start, done: it.done }); // 今回のサイクルを履歴へ
    delete it.done;
    it.start = todayStr();                               // 新しいサイクル開始
    saveItems(items);
    render();
  }

  function startDrag(e, itemEl, handle) {
    e.preventDefault();
    const list = $("list");
    itemEl.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const y = ev.clientY;
      const sibs = [...list.querySelectorAll(".item:not(.dragging)")];
      let placed = false;
      for (const sib of sibs) {
        const r = sib.getBoundingClientRect();
        if (y < r.top + r.height / 2) { list.insertBefore(itemEl, sib); placed = true; break; }
      }
      if (!placed) list.appendChild(itemEl);
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      itemEl.classList.remove("dragging");
      const ids = [...list.querySelectorAll(".item")].map(el => el.dataset.id);
      const items = loadItems().slice().sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      saveItems(items);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  }

  function readPeriod() {
    const v = $("period").value;
    if (v === "none") return { type: "none" };
    if (v === "custom") {
      const d = parseInt($("customDays").value, 10);
      return { type: "days", value: (d && d > 0) ? d : 30 };
    }
    return { type: "months", value: parseInt(v.slice(1), 10) };
  }

  $("period").onchange = () => {
    $("customWrap").style.display = ($("period").value === "custom") ? "block" : "none";
  };

  function populateCategorySelect() {
    const sel = $("category"); sel.innerHTML = "";
    CATS.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = `${c.emoji} ${c.label}`;
      sel.appendChild(o);
    });
  }

  // カテゴリに応じてフォームの見た目（名称の例・日付ラベル・期限欄の要否）を切り替え
  function applyCategoryUI() {
    const c = catOf($("category").value);
    $("name").placeholder = c.namePh;
    $("dateLabel").textContent = c.dateLabel;
    $("periodWrap").style.display = c.hasPeriod ? "block" : "none";
    $("customWrap").style.display =
      (c.hasPeriod && $("period").value === "custom") ? "block" : "none";
  }
  $("category").onchange = () => {
    applyCategoryUI();
    const c = catOf($("category").value);
    selIcon = c.defaultIcon;
    selColor = c.color;
    $("emojiInput").value = "";
    buildPickers();
  };

  // 保存する期間（期限を持たないカテゴリは常に「期限なし」）
  function currentPeriod() {
    return catOf($("category").value).hasPeriod ? readPeriod() : { type: "none" };
  }

  $("emojiInput").addEventListener("input", () => {
    const e = firstEmoji($("emojiInput").value);
    if (e) { selIcon = e; $("iconCurrent").textContent = e; }
  });

  function buildEmojiCats() {
    const nav = $("emojiCats"); nav.innerHTML = "";
    Object.keys(EMOJI).forEach((k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "emoji-cat" + (k === emojiCat ? " active" : "");
      b.textContent = CAT_ICON[k] || "•";
      b.title = k;
      b.onclick = () => { emojiCat = k; $("emojiSearch").value = ""; buildEmojiCats(); renderEmojiGrid(); };
      nav.appendChild(b);
    });
  }
  function renderEmojiGrid() {
    const grid = $("emojiGrid"); grid.innerHTML = "";
    const q = $("emojiSearch").value.trim().toLowerCase();
    let list;
    if (q) {
      const seen = new Set(); list = [];
      for (const k in EMOJI) for (const [e, kw] of EMOJI[k]) {
        if ((e === q || kw.toLowerCase().includes(q)) && !seen.has(e)) { seen.add(e); list.push(e); }
      }
    } else {
      list = EMOJI[emojiCat].map((x) => x[0]);
    }
    if (list.length === 0) { grid.innerHTML = '<div class="none">見つかりませんでした</div>'; return; }
    for (const e of list) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = e;
      b.onclick = () => selectEmoji(e);
      grid.appendChild(b);
    }
  }
  function selectEmoji(e) {
    selIcon = e;
    $("iconCurrent").textContent = e;
    $("emojiPanel").hidden = true;
    $("emojiSearch").value = "";
  }
  $("pickBtn").onclick = () => {
    const p = $("emojiPanel");
    p.hidden = !p.hidden;
    if (!p.hidden) { renderEmojiGrid(); $("emojiSearch").focus(); }
  };
  $("emojiSearch").addEventListener("input", renderEmojiGrid);

  function fillPeriod(period) {
    if (!period || period.type === "none") { $("period").value = "none"; }
    else if (period.type === "months") { $("period").value = "m" + period.value; }
    else { $("period").value = "custom"; $("customDays").value = period.value; }
    $("customWrap").style.display = ($("period").value === "custom") ? "block" : "none";
  }

  function startEdit(id) {
    const it = loadItems().find(x => x.id === id);
    if (!it) return;
    editingId = id;
    $("category").value = it.cat || "cosme";
    $("name").value = it.name || "";
    $("start").value = it.start;
    fillPeriod(it.period);
    applyCategoryUI();
    selIcon = it.icon || ICONS[0];
    selColor = it.color || COLORS[0];
    buildPickers();
    $("doneWrap").hidden = false;
    $("doneDate").value = it.done || "";
    $("addBtn").textContent = "✓ 保存する";
    $("cancelBtn").style.display = "block";
    document.body.classList.add("editing");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function exitEdit() {
    editingId = null;
    $("category").value = "cosme";
    $("name").value = "";
    $("start").value = todayStr();
    $("period").value = "none";
    applyCategoryUI();
    selIcon = ICONS[0];
    selColor = COLORS[0];
    $("emojiInput").value = "";
    $("emojiSearch").value = "";
    $("emojiPanel").hidden = true;
    $("doneWrap").hidden = true;
    $("doneDate").value = "";
    buildPickers();
    $("addBtn").textContent = "＋ 追加する";
    $("cancelBtn").style.display = "none";
    document.body.classList.remove("editing");
  }

  $("cancelBtn").onclick = exitEdit;

  $("addBtn").onclick = () => {
    const name = $("name").value.trim();
    const start = $("start").value;
    if (!start) { alert("開封日 / 使用開始日を選択してください"); return; }
    const items = loadItems();
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) {
        Object.assign(it, { name, start, cat: $("category").value, period: currentPeriod(), icon: selIcon, color: selColor });
        const dv = $("doneDate").value;
        if (dv) it.done = dv; else delete it.done;
      }
      saveItems(items);
      exitEdit();
    } else {
      items.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        name, start, cat: $("category").value, period: currentPeriod(), icon: selIcon, color: selColor
      });
      saveItems(items);
      $("name").value = "";
      $("start").value = todayStr();
    }
    render();
  };

  document.querySelectorAll(".seg button").forEach(b => {
    b.onclick = () => { sortMode = b.dataset.mode; localStorage.setItem(MODE_KEY, sortMode); render(); };
  });

  // 旧「コスメ・日用品」(cat=goods/未設定) を「コスメ」へ一度だけ移行
  (function migrateCats() {
    const items = loadItems();
    let changed = false;
    for (const it of items) {
      if (!it.cat || it.cat === "goods") { it.cat = "cosme"; changed = true; }
      if (!Array.isArray(it.history)) { it.history = []; changed = true; } // 過去の使用サイクル履歴
    }
    if (changed) saveItems(items);
  })();

  populateCategorySelect();
  applyCategoryUI();
  buildEmojiCats();
  $("start").value = todayStr();
  buildPickers();
  render();

  // PWA: Service Worker 登録（オフライン起動・ホーム画面アプリ用）
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
